services:
  - type: web
    name: justice-faite-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PRIMARY_CHAT_ID
        sync: false
      - key: JF_ALLOW_EMPTY_DB_BOOTSTRAP
        value: "false"
      - key: JF_STORAGE_DURABLE
        value: "false"
      - key: ROLE_SYNC_INTERVAL_SECONDS
        value: "300"
